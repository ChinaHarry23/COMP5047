; EDGE firmware: one project, three build targets.
;   tag        the game's bat controller (default; see the [env:tag] note below)
;   kit        FW0 check-in demo from unit-kit parts (button/foil presence,
;              kit LED, phototransistor stand-in, FS90 needle)
;   exhibit    full Revision 3 exhibit (force sensor, AS7343 bat, amber star,
;              needle, forecast, logbook)
; The o1_logger target (Wednesday optics test) was archived on 16 Oct 2026 to
; ../../archive/rev3-exhibit/firmware/src/o1/.
; Platform pinned to the pioarduino build already installed on the team Mac
; (Arduino-ESP32 core 3.3.x on ESP-IDF 5.5), the same as the Week 4 project.

[platformio]
default_envs = tag

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_ldf_mode = deep+

[env:kit]
build_src_filter = -<*> +<kit/>
build_flags = ${env.build_flags} -DEDGE_BUILD_KIT

[env:exhibit]
build_src_filter = -<*> +<exhibit/>
build_flags = ${env.build_flags} -DEDGE_BUILD_EXHIBIT

; tag        bat controller: MPU-6050 on I2C (21/22) -> "ORI ..." UDP to Unity
;            port 1234 at 100 Hz; VIB from Unity drives the GPIO26 LED/motor
;            stage, button on GPIO25 (src/tag/tag_config.h, docs/CIRCUIT_GUIDE_v1.md).
;            pio run -e tag -t upload ; pio device monitor -e tag
;            Add -DTAG_I2C_SCAN_ONLY to build_flags for an I2C-scanner-only build.
[env:tag]
build_src_filter = -<*> +<tag/>
build_flags = ${env.build_flags} -DEDGE_BUILD_TAG

; selftest   circuit check for the soldered protoboard (I2C scan, MPU, BH1750,
;            LED blink, button). Windows: double-click tools/windows/test_circuit.bat
[env:selftest]
build_src_filter = -<*> +<selftest/>
build_flags = ${env.build_flags} -DEDGE_BUILD_SELFTEST
